<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#4d7552" />
<title>TeaPlan</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1b;background:#f7f5f0}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:0 auto;padding:16px 14px 90px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.brand{font-size:28px;font-weight:850}.muted{color:#6d6a63;font-size:13px}.cloud{display:inline-flex;align-items:center;gap:6px;background:#edf4ed;color:#34533a;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.avatar,.btn,.tab,.meal,.statebtn{font:inherit;cursor:pointer}.avatar{width:44px;height:44px;border-radius:14px;border:1px solid #ddd7cc;background:#fff}.card{background:#fff;border:1px solid #e4dfd6;border-radius:20px;padding:17px;margin-bottom:14px}.card h2,.card h3{margin:0 0 7px}.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#f7f5f0;border-top:1px solid #ded8ce;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}.tab{border:0;border-radius:13px;background:transparent;padding:11px 4px;font-size:12px;font-weight:750}.tab.active{background:#4d7552;color:#fff}.btn{border:0;border-radius:13px;background:#e8e4dc;padding:11px 14px;min-height:44px;font-weight:750;color:inherit}.btn.primary{background:#4d7552;color:#fff}.btn.danger{background:#f4e9e8;color:#8c3f38}.btn:disabled{opacity:.5;cursor:not-allowed}.input{width:100%;font:inherit;font-size:16px;border:1px solid #d9d3c9;border-radius:13px;padding:12px;background:#fff;color:#1d1d1b}.label{display:block;font-size:13px;color:#6d6a63;margin:12px 0 5px}.meals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.meal{min-width:0;text-align:left;border:1px solid #ddd7cc;background:#fff;border-radius:15px;padding:13px;color:inherit}.meal.on{border:2px solid #4d7552;background:#edf4ed}.meal b{display:block}.row{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eee9e1}.grow{flex:1;min-width:0}.category{font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;color:#77736b;margin-top:17px}.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin:13px 0}.statebtn{width:42px;height:42px;border:1px solid #ddd7cc;border-radius:50%;background:#fff;font-size:20px}.shopitem.have{opacity:.72}.shopitem.bought .grow b{text-decoration:line-through;opacity:.5}.state-label{font-size:11px;color:#6d6a63;margin-top:2px}.notice{background:#f1eee7;border-radius:14px;padding:12px;margin-top:12px;font-size:13px}.error{background:#f7e9e7;color:#8a3d36}.ok{background:#edf4ed;color:#34533a}.authswitch{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}.authswitch button{border:0;border-radius:12px;padding:10px;background:#eeeae2;font-weight:700}.authswitch button.active{background:#4d7552;color:#fff}.invite{background:#f0ede6;border-radius:15px;padding:14px;margin:15px 0}.invite strong{display:block;font-size:26px;letter-spacing:.08em;margin:5px 0}.loading{padding:30px;text-align:center;color:#6d6a63}.pill{display:inline-block;background:#eeeae2;border-radius:999px;padding:6px 9px;font-size:12px}.summaryline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.statusdot{width:8px;height:8px;border-radius:50%;background:#4d7552;display:inline-block}.hidden{display:none!important}@media(max-width:560px){.meals{grid-template-columns:1fr}.app{padding-left:12px;padding-right:12px}.card{padding:15px}.summaryline{flex-direction:column}}@media(prefers-color-scheme:dark){:root{color:#f5f5f2;background:#151515}.app,.tabs{background:#151515}.card,.avatar,.meal,.input,.statebtn{background:#202020;color:#f5f5f2;border-color:#373737}.muted,.label,.state-label,.category{color:#aaa69e}.meal.on{background:#243026;border-color:#5e8d64}.btn{background:#303030;color:#f5f5f2}.authswitch button{background:#303030;color:#f5f5f2}.row{border-color:#333}.invite,.notice{background:#292929}.cloud{background:#243026;color:#dfeadf}.tabs{border-color:#333}}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading TeaPlan…</div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';

const SUPABASE_URL='https://abkkjbbdqbieiivdbxad.supabase.co';
const SUPABASE_KEY='sb_publishable_vjGeUvVBveqlD_ipO6y5Bw_EUE-z_TX';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

const starterRecipes=[
 {title:'Chicken Fajitas',emoji:'🌮',servings:4,cook_minutes:25,ingredients:[['Meat','Chicken breast',600,'g'],['Fruit & Veg','Onion',1,''],['Fruit & Veg','Peppers',3,''],['Bakery','Tortilla wraps',8,'']]},
 {title:'Chicken Curry',emoji:'🍛',servings:4,cook_minutes:35,ingredients:[['Meat','Chicken breast',600,'g'],['Fruit & Veg','Onion',2,''],['Cupboard','Rice',500,'g'],['Cupboard','Curry sauce',1,'jar']]},
 {title:'Spaghetti Bolognese',emoji:'🍝',servings:4,cook_minutes:30,ingredients:[['Meat','Beef mince',500,'g'],['Fruit & Veg','Onion',1,''],['Cupboard','Pasta',500,'g'],['Cupboard','Passata',1,'jar']]}
];

const state={tab:'week',user:null,household:null,recipes:[],selected:new Set(),shopping:[],authMode:'signin',message:'',messageType:'ok',channel:null,weekStart:null,loading:true};
const root=document.getElementById('app');

const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const statusLabel=s=>s==='have'?'Already have':s==='bought'?'Bought':'Need it';
const statusIcon=s=>s==='have'?'🏠':s==='bought'?'✓':'○';
const nextStatus=s=>s==='need'?'have':s==='have'?'bought':'need';
function mondayISO(){const d=new Date();const day=d.getDay()||7;d.setHours(12,0,0,0);d.setDate(d.getDate()-day+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function qty(q,u){const n=Number(q||0);if(u==='g'&&n>=1000)return `${(n/1000).toFixed(n%1000?1:0)}kg`;return `${n}${u?' '+u:''}`}
function setMessage(msg,type='ok'){state.message=msg;state.messageType=type;render()}

async function loadUser(){const {data,error}=await supabase.auth.getUser();if(error && error.message!=='Auth session missing!') console.warn(error);state.user=data?.user||null}
async function loadHousehold(){state.household=null;if(!state.user)return;const {data,error}=await supabase.from('household_members').select('household_id,households(id,name,invite_code)').eq('user_id',state.user.id).limit(1).maybeSingle();if(error){console.warn(error);return}if(data?.households)state.household=data.households}

async function ensureStarterRecipes(){if(!state.household)return;const {data:existing,error}=await supabase.from('recipes').select('id,title,emoji,servings,cook_minutes').eq('household_id',state.household.id).order('created_at');if(error)throw error;if(existing?.length){state.recipes=existing;return}
 for(const r of starterRecipes){const {data:rec,error:re}=await supabase.from('recipes').insert({household_id:state.household.id,title:r.title,emoji:r.emoji,servings:r.servings,cook_minutes:r.cook_minutes,method:[]}).select().single();if(re)throw re;const rows=r.ingredients.map(([category,name,quantity,unit])=>({recipe_id:rec.id,raw_text:`${quantity}${unit?' '+unit:''} ${name}`,normalized_name:name.toLowerCase(),quantity,unit,category}));const {error:ie}=await supabase.from('recipe_ingredients').insert(rows);if(ie)throw ie}
 const {data}=await supabase.from('recipes').select('id,title,emoji,servings,cook_minutes').eq('household_id',state.household.id).order('created_at');state.recipes=data||[];
}

async function loadCloudData(){if(!state.household)return;state.weekStart=mondayISO();const [recipesRes,mealsRes,shopRes]=await Promise.all([
 supabase.from('recipes').select('id,title,emoji,servings,cook_minutes').eq('household_id',state.household.id).order('created_at'),
 supabase.from('weekly_meals').select('recipe_id').eq('household_id',state.household.id).eq('week_start',state.weekStart),
 supabase.from('shopping_items').select('*').eq('household_id',state.household.id).eq('week_start',state.weekStart).order('category').order('created_at')
]);
 if(recipesRes.error)throw recipesRes.error;if(mealsRes.error)throw mealsRes.error;if(shopRes.error)throw shopRes.error;
 state.recipes=recipesRes.data||[];state.selected=new Set((mealsRes.data||[]).map(x=>x.recipe_id));state.shopping=shopRes.data||[];
}

async function setupRealtime(){if(state.channel){await supabase.removeChannel(state.channel);state.channel=null}if(!state.household)return;const hid=state.household.id;state.channel=supabase.channel(`teaplan-${hid}-${state.weekStart}`)
 .on('postgres_changes',{event:'*',schema:'public',table:'weekly_meals',filter:`household_id=eq.${hid}`},async()=>{await loadCloudData();render()})
 .on('postgres_changes',{event:'*',schema:'public',table:'shopping_items',filter:`household_id=eq.${hid}`},async()=>{await loadCloudData();render()})
 .on('postgres_changes',{event:'*',schema:'public',table:'recipes',filter:`household_id=eq.${hid}`},async()=>{await loadCloudData();render()})
 .subscribe();
}

async function rebuildRecipeShopping(){if(!state.household)return;const hid=state.household.id;const week=state.weekStart;
 const {error:delErr}=await supabase.from('shopping_items').delete().eq('household_id',hid).eq('week_start',week).eq('source_type','recipe');if(delErr)throw delErr;
 if(!state.selected.size)return;
 const ids=[...state.selected];const {data:ings,error}=await supabase.from('recipe_ingredients').select('recipe_id,normalized_name,quantity,unit,category,recipes(title)').in('recipe_id',ids);if(error)throw error;
 const map=new Map();for(const i of ings||[]){const key=`${i.category}|${i.normalized_name}|${i.unit||''}`;if(!map.has(key))map.set(key,{household_id:hid,week_start:week,normalized_name:i.normalized_name,display_name:i.normalized_name.replace(/\b\w/g,c=>c.toUpperCase()),quantity:0,unit:i.unit||'',category:i.category||'Other',source_type:'recipe',status:'need',sources:[]});const x=map.get(key);x.quantity+=Number(i.quantity||0);if(i.recipes?.title)x.sources.push(i.recipes.title)}
 const rows=[...map.values()].map(({sources,...x})=>x);if(rows.length){const {error:insErr}=await supabase.from('shopping_items').insert(rows);if(insErr)throw insErr}
}

async function toggleMeal(id){if(!state.household)return;const hid=state.household.id;const week=state.weekStart;try{if(state.selected.has(id)){const {error}=await supabase.from('weekly_meals').delete().eq('household_id',hid).eq('recipe_id',id).eq('week_start',week);if(error)throw error}else{const {error}=await supabase.from('weekly_meals').insert({household_id:hid,recipe_id:id,week_start:week});if(error && error.code!=='23505')throw error}await loadCloudData();await rebuildRecipeShopping();await loadCloudData();render()}catch(e){setMessage(e.message||'Could not update this week','error')}}

async function addManualItem(name){if(!state.household)return;const clean=name.trim();if(!clean)return;const {error}=await supabase.from('shopping_items').insert({household_id:state.household.id,week_start:state.weekStart,normalized_name:clean.toLowerCase(),display_name:clean,quantity:1,unit:'',category:'Household',source_type:'manual',status:'need'});if(error)throw error;await loadCloudData();render()}
async function cycleShopping(id,current){const {error}=await supabase.from('shopping_items').update({status:nextStatus(current)}).eq('id',id);if(error)throw error;await loadCloudData();render()}
async function deleteShopping(id){const {error}=await supabase.from('shopping_items').delete().eq('id',id);if(error)throw error;await loadCloudData();render()}

function top(){return `<div class="top"><div><div class="brand">TeaPlan</div><div class="muted">${state.household?`🏠 ${esc(state.household.name)} · <span class="cloud"><span class="statusdot"></span>Live shared</span>`:'Shared household meal planner'}</div></div><button class="avatar" data-tab="account" type="button">👤</button></div>`}
function tabs(){if(!state.user||!state.household||state.tab==='account')return'';return `<nav class="tabs">${[['week','This week'],['recipes','Recipes'],['add','Add recipe'],['shop','Shopping']].map(([id,label])=>`<button type="button" class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</nav>`}
function weekView(){return `<div class="card"><h2>This week's teas</h2><p class="muted">Tap a meal to add or remove it. These selections are now shared between both phones.</p><div class="meals">${state.recipes.map(r=>`<button type="button" class="meal ${state.selected.has(r.id)?'on':''}" data-meal="${r.id}"><b>${esc(r.emoji||'🍽️')} ${esc(r.title)}</b><span class="muted">${r.cook_minutes?`${r.cook_minutes} min`:''}${r.servings?` · Serves ${r.servings}`:''}</span></button>`).join('')}</div></div><div class="card"><b>${state.selected.size} teas selected</b><p class="muted">Changes are stored in Supabase and broadcast to the household.</p><button type="button" class="btn primary" data-tab="shop">Open shopping list</button></div>`}
function recipeView(){return `<div class="card"><div class="summaryline"><div><h2>Our recipes</h2><p class="muted">Shared household recipe library.</p></div><button class="btn primary" type="button" data-tab="add">＋ Add recipe</button></div>${state.recipes.map(r=>`<div class="row"><div class="grow"><b>${esc(r.emoji||'🍽️')} ${esc(r.title)}</b><div class="muted">${r.cook_minutes?`${r.cook_minutes} min`:''}${r.servings?` · Serves ${r.servings}`:''}</div></div></div>`).join('')}</div>`}
function addView(){return `<div class="card"><h2>Add recipe</h2><p class="muted">The AI importer comes after sync, meal types and macros. For this build, the shared recipe library is read-only except for the starter meals.</p><button class="btn" type="button" disabled>AI import · coming next</button></div>`}
function shopView(){const cats={};for(const x of state.shopping){(cats[x.category||'Other']??=[]).push(x)}return `<div class="card"><h2>Shopping list</h2><p class="muted">Tap the circle: <b>Need it → Already have → Bought</b>. Every change is saved to the shared household.</p><form class="add" id="manualForm"><input class="input" id="manualInput" placeholder="Add toilet roll, milk…" autocomplete="off"><button class="btn primary" type="submit">Add</button></form>${Object.keys(cats).length?Object.entries(cats).map(([cat,items])=>`<div class="category">${esc(cat)}</div>${items.map(x=>`<div class="row shopitem ${esc(x.status)}"><button type="button" class="statebtn" data-shop="${x.id}" data-status="${esc(x.status)}" aria-label="Change ${esc(x.display_name)} status">${statusIcon(x.status)}</button><div class="grow"><b>${esc(x.display_name)}</b><div class="state-label">${statusLabel(x.status)}${x.source_type==='recipe'?' · From this week’s recipes':' · Added manually'}</div></div><b>${x.quantity?qty(x.quantity,x.unit):''}</b>${x.source_type==='manual'?`<button type="button" class="btn danger" data-delete-shop="${x.id}">×</button>`:''}</div>`).join('')}`).join(''):`<div class="notice">Your shared shopping list is empty.</div>`}</div>`}
function accountView(){if(!state.user)return `<div class="card"><h2>Welcome to TeaPlan</h2><div class="authswitch"><button type="button" class="${state.authMode==='signin'?'active':''}" data-authmode="signin">Sign in</button><button type="button" class="${state.authMode==='signup'?'active':''}" data-authmode="signup">Create account</button></div><form id="authForm"><label class="label">Email</label><input class="input" id="email" type="email" required><label class="label">Password</label><input class="input" id="password" type="password" minlength="6" required><div style="margin-top:12px"><button class="btn primary" type="submit">${state.authMode==='signin'?'Sign in':'Create account'}</button></div></form></div>`;
 if(!state.household)return `<div class="card"><h2>Set up your household</h2><form id="createHousehold"><label class="label">Household name</label><input class="input" id="hname" value="Our Household" required><div style="margin-top:10px"><button class="btn primary">Create household</button></div></form><p class="muted" style="text-align:center;margin:16px 0">or</p><form id="joinHousehold"><label class="label">Invite code</label><input class="input" id="code" placeholder="A1B2C3D4" required><div style="margin-top:10px"><button class="btn">Join household</button></div></form><div style="margin-top:15px"><button class="btn danger" id="signOut" type="button">Sign out</button></div></div>`;
 return `<div class="card"><h2>${esc(state.household.name)}</h2><p class="muted">Signed in as ${esc(state.user.email)}</p><div class="invite"><span class="muted">HOUSEHOLD INVITE CODE</span><strong>${esc(state.household.invite_code)}</strong><span class="muted">Both phones are connected to the same Supabase household.</span></div><span class="cloud"><span class="statusdot"></span>Realtime enabled</span><div style="margin-top:15px"><button class="btn danger" id="signOut" type="button">Sign out</button> <button class="btn" type="button" data-tab="week">← Back</button></div></div>`}
function content(){if(!state.user||!state.household)state.tab='account';if(state.tab==='week')return weekView();if(state.tab==='recipes')return recipeView();if(state.tab==='add')return addView();if(state.tab==='shop')return shopView();return accountView()}
function render(){root.innerHTML=`<main class="app">${top()}${state.message?`<div class="notice ${state.messageType==='error'?'error':'ok'}">${esc(state.message)}</div>`:''}${state.loading?'<div class="loading">Loading shared household…</div>':content()}${tabs()}</main>`;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;state.message='';render()}));document.querySelectorAll('[data-authmode]').forEach(b=>b.addEventListener('click',()=>{state.authMode=b.dataset.authmode;state.message='';render()}));document.querySelectorAll('[data-meal]').forEach(b=>b.addEventListener('click',()=>toggleMeal(b.dataset.meal)));
 document.querySelectorAll('[data-shop]').forEach(b=>b.addEventListener('click',async()=>{try{await cycleShopping(b.dataset.shop,b.dataset.status)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-delete-shop]').forEach(b=>b.addEventListener('click',async()=>{try{await deleteShopping(b.dataset.deleteShop)}catch(e){setMessage(e.message,'error')}}));
 const mf=document.getElementById('manualForm');if(mf)mf.addEventListener('submit',async e=>{e.preventDefault();const i=document.getElementById('manualInput');try{await addManualItem(i.value);i.value=''}catch(err){setMessage(err.message,'error')}});
 const af=document.getElementById('authForm');if(af)af.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;let res=state.authMode==='signup'?await supabase.auth.signUp({email,password}):await supabase.auth.signInWithPassword({email,password});if(res.error)return setMessage(res.error.message,'error');state.message=state.authMode==='signup'?'Account created. Check your email if confirmation is enabled.':'Signed in.';await init()});
 const ch=document.getElementById('createHousehold');if(ch)ch.addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('hname').value.trim();const {data,error}=await supabase.rpc('create_household',{household_name:name});if(error)return setMessage(error.message,'error');state.household=data;await ensureStarterRecipes();await loadCloudData();await setupRealtime();state.tab='week';render()});
 const jh=document.getElementById('joinHousehold');if(jh)jh.addEventListener('submit',async e=>{e.preventDefault();const code=document.getElementById('code').value.trim();const {data,error}=await supabase.rpc('join_household',{code});if(error)return setMessage(error.message,'error');state.household=data;await loadCloudData();await setupRealtime();state.tab='week';render()});
 const so=document.getElementById('signOut');if(so)so.addEventListener('click',async()=>{await supabase.auth.signOut();if(state.channel)await supabase.removeChannel(state.channel);Object.assign(state,{user:null,household:null,recipes:[],selected:new Set(),shopping:[],tab:'account',message:'',channel:null});render()});
}

async function init(){state.loading=true;render();try{await loadUser();await loadHousehold();if(state.user&&state.household){await ensureStarterRecipes();await loadCloudData();await setupRealtime();state.tab=state.tab==='account'?'week':state.tab}}catch(e){state.message=e.message||'Could not load TeaPlan';state.messageType='error'}finally{state.loading=false;render()}}
supabase.auth.onAuthStateChange(async(_event,session)=>{state.user=session?.user||null;if(state.user){await loadHousehold();if(state.household){await ensureStarterRecipes();await loadCloudData();await setupRealtime()}}render()});
init();
</script>
</body>
</html>
