function profileMeals(profileId){const out=[];for(const p of state.plans){if(!eaterIds(p).has(profileId))continue;const r=state.recipes.find(x=>x.id===p.recipe_id);if(!r)continue;const eater=(p.meal_eaters||[]).find(x=>x.profile_id===profileId);const portions=Number(eater?.portions||1);out.push({plan:p,recipe:r,portions,day:Number(p.day_index||0),type:p.meal_type})}return out}
function profileSummary(profile){const meals=profileMeals(profile.id);const total=meals.reduce((a,x)=>({calories:a.calories+Number(x.recipe.calories||0)*x.portions,protein:a.protein+Number(x.recipe.protein_g||0)*x.portions,carbs:a.carbs+Number(x.recipe.carbs_g||0)*x.portions,fat:a.fat+Number(x.recipe.fat_g||0)*x.portions}),{calories:0,protein:0,carbs:0,fat:0});const perDay=[0,1,2,3,4,5,6].map(day=>{const d=meals.filter(x=>x.day===day);return {day,meals:d,calories:d.reduce((n,x)=>n+Number(x.recipe.calories||0)*x.portions,0),protein:d.reduce((n,x)=>n+Number(x.recipe.protein_g||0)*x.portions,0)}});return {meals,total,perDay}}
function weeklyOverviewHtml(){if(!state.profiles.length)return'';if(!state.summaryProfileId||!state.profiles.some(p=>p.id===state.summaryProfileId))state.summaryProfileId=state.profiles[0].id;const profile=state.profiles.find(p=>p.id===state.summaryProfileId)||state.profiles[0];const s=profileSummary(profile);const chips=`<div class="overviewchips">${state.profiles.map(p=>`<button type="button" class="overviewchip ${p.id===profile.id?'active':''}" data-summary-profile="${p.id}">${esc(p.emoji||'👤')} ${esc(p.name)}</button>`).join('')}</div>`;if(profile.profile_type==='baby'){const mealTypes=['breakfast','lunch','tea','snack'];const plannedSlots=new Set(s.meals.map(x=>`${x.day}|${x.type}`));const gaps=[];for(let day=0;day<7;day++)for(const type of mealTypes)if(!plannedSlots.has(`${day}|${type}`))gaps.push(`${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][day]} ${mealLabel(type)}`);return `<div class="weekoverview"><b>Weekly overview</b>${chips}<div class="overviewgrid"><div class="overviewstat"><b>${new Set(s.meals.map(x=>`${x.day}|${x.type}`)).size}</b><span class="muted">meals planned</span></div><div class="overviewstat"><b>${28-s.meals.length}</b><span class="muted">meal gaps</span></div><div class="overviewstat"><b>${new Set(s.meals.map(x=>x.day)).size}/7</b><span class="muted">days covered</span></div></div><div class="babyoverview"><b>${esc(profile.name)}'s plan</b><div class="muted" style="margin-top:4px">${gaps.length?`Still to plan: ${gaps.slice(0,6).join(', ')}${gaps.length>6?'…':''}`:'All Breakfast, Lunch, Tea and Snack slots are planned.'}</div></div></div>`}const daysWithMeals=new Set(s.meals.map(x=>x.day)).size||1;return `<div class="weekoverview"><b>Weekly overview</b>${chips}<div class="overviewgrid"><div class="overviewstat"><b>${Math.round(s.total.calories)}</b><span class="muted">kcal planned</span></div><div class="overviewstat"><b>${s.total.protein.toFixed(0)}g</b><span class="muted">protein</span></div><div class="overviewstat"><b>${new Set(s.meals.map(x=>`${x.day}|${x.type}`)).size}</b><span class="muted">meals</span></div></div><div class="overviewgrid"><div class="overviewstat"><b>${Math.round(s.total.calories/daysWithMeals)}</b><span class="muted">kcal / planned day</span></div><div class="overviewstat"><b>${(s.total.protein/daysWithMeals).toFixed(0)}g</b><span class="muted">protein / day</span></div><div class="overviewstat"><b>${daysWithMeals}/7</b><span class="muted">days covered</span></div></div><div class="overviewdays">${s.perDay.map(d=>`<div class="overviewday"><span><b>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d.day]}</b> · ${new Set(d.meals.map(x=>x.type)).size} meal${new Set(d.meals.map(x=>x.type)).size===1?'':'s'}</span><span>${Math.round(d.calories)} kcal · ${d.protein.toFixed(0)}g P</span></div>`).join('')}</div></div>`}

async function rebuildRecipeShopping(){if(!state.household)return;const hid=state.household.id,week=state.weekStart;const {error:delErr}=await supabase.from('shopping_items').delete().eq('household_id',hid).eq('week_start',week).eq('source_type','recipe');if(delErr)throw delErr;const map=new Map();if(state.plans.length){const ids=[...new Set(state.plans.map(p=>p.recipe_id))];const {data:ings,error}=await supabase.from('recipe_ingredients').select('recipe_id,normalized_name,quantity,unit,category').in('recipe_id',ids);if(error)throw error;const recipeById=new Map(state.recipes.map(r=>[r.id,r]));const multipliers=new Map();for(const p of state.plans){const r=recipeById.get(p.recipe_id);if(!r)continue;const serves=Math.max(1,Number(r.servings||1)),fresh=Math.max(0,Number(p.cook_portions??p.portions??1));multipliers.set(p.recipe_id,(multipliers.get(p.recipe_id)||0)+(fresh/serves))}for(const i of ings||[]){const mult=multipliers.get(i.recipe_id)||0;if(!mult)continue;const key=`${i.category}|${i.normalized_name}|${i.unit||''}`;if(!map.has(key))map.set(key,{household_id:hid,week_start:week,normalized_name:i.normalized_name,display_name:i.normalized_name.replace(/\b\w/g,c=>c.toUpperCase()),quantity:0,unit:i.unit||'',category:i.category||'Other',source_type:'recipe',status:'need'});map.get(key).quantity+=Number(i.quantity||0)*mult}}for(const a of state.addons){const key=`${a.category}|${a.normalized_name}|${a.unit||''}`;if(!map.has(key))map.set(key,{household_id:hid,week_start:week,normalized_name:a.normalized_name,display_name:a.name,quantity:0,unit:a.unit||'',category:a.category||'Other',source_type:'recipe',status:'need'});map.get(key).quantity+=Number(a.quantity||0)}for(const item of map.values()){const stock=state.pantry.find(p=>p.normalized_name===item.normalized_name&&(p.unit||'')===(item.unit||''));if(stock){if(stock.always_have){item.quantity=0}else item.quantity=Math.max(0,Number(item.quantity||0)-Number(stock.quantity||0))}}const rows=[...map.values()].filter(x=>Number(x.quantity||0)>0);if(rows.length){const {error:insErr}=await supabase.from('shopping_items').insert(rows);if(insErr)throw insErr}}
async function setPortions(recipeId,type,newCount,dayIndex=0){if(!state.household)return;const count=Math.max(0,Math.min(30,Number(newCount)||0));const existing=planFor(recipeId,type,dayIndex);try{if(count===0&&existing){const {error}=await supabase.from('weekly_meals').delete().eq('id',existing.id);if(error)throw error}else if(existing){const {error}=await supabase.from('weekly_meals').update({portions:count}).eq('id',existing.id);if(error)throw error}else if(count>0){const {error}=await supabase.from('weekly_meals').insert({household_id:state.household.id,recipe_id:recipeId,week_start:state.weekStart,meal_type:type,portions:count,day_index:dayIndex});if(error)throw error}await loadCloudData();await rebuildRecipeShopping();await loadCloudData();render()}catch(e){setMessage(e.message||'Could not update meal plan','error')}}
async function chooseRecipeForSlot(recipeId,dayIndex,type){if(!state.household)return;const same=state.plans.find(p=>Number(p.day_index||0)===Number(dayIndex)&&p.meal_type===type&&p.recipe_id===recipeId);if(same){state.pickerDay=null;state.pickerType=null;return render()}const recipe=state.recipes.find(r=>r.id===recipeId);const cook=Math.max(1,Number(recipe?.servings||1));const {error}=await supabase.from('weekly_meals').insert({household_id:state.household.id,recipe_id:recipeId,week_start:state.weekStart,meal_type:type,portions:1,cook_portions:cook,freezer_used:0,freezer_saved:0,day_index:dayIndex});if(error)throw error;state.pickerDay=null;state.pickerType=null;await loadCloudData();await rebuildRecipeShopping();await loadCloudData();render()}
async function copyPlanToDay(planId,targetDay){
 const source=state.plans.find(p=>p.id===planId);if(!source)return;
 const exists=state.plans.find(p=>Number(p.day_index||0)===Number(targetDay)&&p.meal_type===source.meal_type&&p.recipe_id===source.recipe_id);
 if(exists)return;
 const {data:newPlan,error}=await supabase.from('weekly_meals').insert({household_id:state.household.id,recipe_id:source.recipe_id,week_start:state.weekStart,meal_type:source.meal_type,portions:source.portions||1,cook_portions:source.cook_portions??source.portions??1,freezer_used:0,freezer_saved:0,day_index:targetDay}).select('id').single();

async function copyMealPrompt(planId){
 const source=state.plans.find(p=>p.id===planId);if(!source)return;
 const target=prompt(`Copy this ${mealLabel(source.meal_type)} to which day? Enter Mon, Tue, Wed, Thu, Fri, Sat or Sun.`);
 if(!target)return;
 const map={mon:0,monday:0,tue:1,tues:1,tuesday:1,wed:2,wednesday:2,thu:3,thur:3,thurs:3,thursday:3,fri:4,friday:4,sat:5,saturday:5,sun:6,sunday:6};
 const d=map[target.trim().toLowerCase()];if(d===undefined){alert('Please enter a day such as Tue or Tuesday.');return}

}
async function copyWholeDay(sourceDay,targetDay){

 await loadCloudData();await rebuildRecipeShopping();await loadCloudData();state.copySourceDay=null;state.selectedDay=targetDay;render();
}

async function toggleEater(planId,profileId){const plan=state.plans.find(p=>p.id===planId);if(!plan)return;const assigned=eaterIds(plan).has(profileId);if(assigned){const {error}=await supabase.from('meal_eaters').delete().eq('weekly_meal_id',planId).eq('profile_id',profileId);if(error)throw error}else{const {error}=await supabase.from('meal_eaters').insert({weekly_meal_id:planId,profile_id:profileId,portions:1});if(error)throw error}const {data:rows,error:readErr}=await supabase.from('meal_eaters').select('profile_id,portions').eq('weekly_meal_id',planId);if(readErr)throw readErr;const count=Math.max(1,(rows||[]).reduce((n,x)=>n+Number(x.portions||1),0));const currentCook=Math.max(0,Number(plan.cook_portions??1)),used=Math.max(0,Number(plan.freezer_used||0));const cookNeeded=Math.max(currentCook,count-used);const {error:updateErr}=await supabase.from('weekly_meals').update({portions:count,cook_portions:cookNeeded}).eq('id',planId);if(updateErr)throw updateErr;await loadCloudData();await rebuildRecipeShopping();await loadCloudData();render()}
function freezerAvailable(recipeId){return state.freezer.filter(x=>x.recipe_id===recipeId).reduce((n,x)=>n+Number(x.portions||0),0)}
async function setCookPortions(planId,value){const plan=state.plans.find(p=>p.id===planId);if(!plan)return;const eat=Math.max(1,eaterCount(plan)||Number(plan.portions||1)),used=Math.max(0,Number(plan.freezer_used||0)),saved=Math.max(0,Number(plan.freezer_saved||0)),v=Math.max(0,Math.min(30,Number(value)||0)),minFresh=Math.max(0,eat-used+saved);if(v<minFresh)throw new Error(`You need at least ${minFresh} freshly cooked portion${minFresh===1?'':'s'} for the people eating and portions already saved to the freezer.`);const {error}=await supabase.from('weekly_meals').update({cook_portions:v}).eq('id',planId);if(error)throw error;await loadCloudData();await rebuildRecipeShopping();await loadCloudData();render()}
async function saveFreezerExtras(planId){const plan=state.plans.find(p=>p.id===planId);if(!plan)return;const eat=Math.max(1,eaterCount(plan)||Number(plan.portions||1)),cook=Math.max(0,Number(plan.cook_portions||0)),used=Math.max(0,Number(plan.freezer_used||0)),extra=Math.max(0,cook+used-eat),saved=Math.max(0,Number(plan.freezer_saved||0)),toSave=Math.max(0,extra-saved);if(!toSave)throw new Error('There are no new extra portions to add to the freezer.');const {error}=await supabase.from('freezer_items').insert({household_id:state.household.id,recipe_id:plan.recipe_id,portions:toSave,frozen_at:new Date().toISOString().slice(0,10),source_weekly_meal_id:planId});if(error)throw error;const {error:u}=await supabase.from('weekly_meals').update({freezer_saved:saved+toSave}).eq('id',planId);if(u)throw u;await loadCloudData();render()}
async function useFreezerForPlan(planId){const plan=state.plans.find(p=>p.id===planId);if(!plan)return;const available=freezerAvailable(plan.recipe_id);if(!available)throw new Error('No portions of this recipe are in the freezer.');const eat=Math.max(1,eaterCount(plan)||Number(plan.portions||1));const maxUse=Math.min(available,eat);const raw=prompt(`You have ${available} frozen portion${available===1?'':'s'}. How many should TeaPlan use for this meal?`,String(maxUse));if(raw===null)return;const use=Math.max(0,Math.min(maxUse,Number(raw)||0));if(!use)return;let remaining=use;for(const item of state.freezer.filter(x=>x.recipe_id===plan.recipe_id)){if(remaining<=0)break;const take=Math.min(remaining,Number(item.portions||0)),left=Number(item.portions||0)-take;const {error}=left>0?await supabase.from('freezer_items').update({portions:left}).eq('id',item.id):await supabase.from('freezer_items').delete().eq('id',item.id);if(error)throw error;remaining-=take}const currentUsed=Math.max(0,Number(plan.freezer_used||0)),currentCook=Math.max(0,Number(plan.cook_portions||0));const newUsed=currentUsed+use,newCook=Math.max(0,currentCook-use);const {error:u}=await supabase.from('weekly_meals').update({freezer_used:newUsed,cook_portions:newCook}).eq('id',planId);if(u)throw u;await loadCloudData();await rebuildRecipeShopping();await loadCloudData();render()}

async function deleteShopping(id){const {error}=await supabase.from('shopping_items').delete().eq('id',id);if(error)throw error;await loadCloudData();render()}

function blankDraft(){return {title:'',emoji:'🍽️',meal_type:'tea',servings:4,prep_minutes:10,cook_minutes:30,calories:0,protein_g:0,carbs_g:0,fat_g:0,ingredients:[{raw_text:'',name:'',quantity:0,unit:'',category:'Other'}],method:[''],notes:'',source_type:'manual',source_url:'',nutrition_source:'manual',editing_id:null}}
function normaliseDraft(d){const x={...blankDraft(),...(d||{})};x.ingredients=Array.isArray(x.ingredients)&&x.ingredients.length?x.ingredients:[{raw_text:'',name:'',quantity:0,unit:'',category:'Other'}];x.method=Array.isArray(x.method)&&x.method.length?x.method:[''];return x}
async function importRecipeAI(){const mode=state.importMode;const body={mode};if(mode==='text')body.text=document.getElementById('importText')?.value.trim()||'';if(mode==='url')body.url=document.getElementById('importUrl')?.value.trim()||'';if(mode==='image'){if(!state.importImage?.data)throw new Error('Choose a screenshot or photo first.');body.image=state.importImage.data}const {data:{session}}=await supabase.auth.getSession();if(!session?.access_token)throw new Error('Please sign in again.');state.importBusy=true;state.message='';render();try{const r=await fetch('/api/import-recipe',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not import recipe.');state.draft=normaliseDraft(j.recipe);state.draft.source_type=mode;state.draft.source_url=mode==='url'?body.url:'';state.draft.nutrition_source='ai_estimate';state.message='Recipe extracted. TeaPlan will calculate nutrition from the ingredients when you review it.';state.messageType='ok';setTimeout(()=>calculateNutrition(false).catch(e=>{state.message='Recipe extracted. Nutrition needs review: '+e.message;state.messageType='error';render()}),0)}finally{state.importBusy=false;render()}}
function readDraftFromForm(){const d=normaliseDraft(state.draft);d.title=document.getElementById('dTitle')?.value.trim()||'';d.emoji=document.getElementById('dEmoji')?.value.trim()||'🍽️';d.meal_type=document.getElementById('dMeal')?.value||'tea';d.servings=Math.max(1,Number(document.getElementById('dServings')?.value)||1);d.prep_minutes=Math.max(0,Number(document.getElementById('dPrep')?.value)||0);d.cook_minutes=Math.max(0,Number(document.getElementById('dCook')?.value)||0);for(const k of ['calories','protein_g','carbs_g','fat_g'])d[k]=Math.max(0,Number(document.getElementById('d_'+k)?.value)||0);d.ingredients=[...document.querySelectorAll('[data-ing-row]')].map(row=>({raw_text:row.querySelector('[data-i-raw]').value.trim(),name:row.querySelector('[data-i-name]').value.trim(),quantity:Math.max(0,Number(row.querySelector('[data-i-qty]').value)||0),unit:row.querySelector('[data-i-unit]').value.trim(),category:row.querySelector('[data-i-cat]').value})).filter(i=>i.name||i.raw_text);d.method=[...document.querySelectorAll('[data-method-input]')].map(x=>x.value.trim()).filter(Boolean);d.notes=document.getElementById('dNotes')?.value.trim()||'';return d}
async function saveDraftRecipe(){if(!state.household)return;const d=readDraftFromForm();if(!d.title)throw new Error('Give the recipe a name.');if(!d.ingredients.length)throw new Error('Add at least one ingredient.');if(!d.method.length)throw new Error('Add at least one method step.');const payload={household_id:state.household.id,title:d.title,emoji:d.emoji||'🍽️',servings:d.servings,prep_minutes:d.prep_minutes,cook_minutes:d.cook_minutes,calories:Math.round(d.calories),protein_g:d.protein_g,carbs_g:d.carbs_g,fat_g:d.fat_g,default_meal_type:d.meal_type,source_type:d.source_type||'manual',source_url:d.source_url||null,method:d.method,nutrition_source:d.nutrition_source||'manual'};let rec;if(d.editing_id){const {data,error}=await supabase.from('recipes').update(payload).eq('id',d.editing_id).select().single();if(error)throw error;rec=data;const {error:del}=await supabase.from('recipe_ingredients').delete().eq('recipe_id',d.editing_id);if(del)throw del}else{const {data,error}=await supabase.from('recipes').insert(payload).select().single();if(error)throw error;rec=data}const rows=d.ingredients.map(i=>({recipe_id:rec.id,raw_text:i.raw_text||`${i.quantity||''} ${i.unit||''} ${i.name}`.trim(),normalized_name:(i.name||i.raw_text).toLowerCase().trim(),quantity:Number(i.quantity||0),unit:i.unit||'',category:i.category||'Other'}));const {error:ie}=await supabase.from('recipe_ingredients').insert(rows);if(ie)throw ie;state.draft=null;state.recipeDetail=null;await loadCloudData();await rebuildRecipeShopping();await loadCloudData();state.tab='recipes';state.message=d.editing_id?'Recipe updated.':'Recipe saved to your shared household.';state.messageType='ok';render()}
async function editRecipe(id){const r=state.recipes.find(x=>x.id===id);if(!r)return;const {data:ings,error}=await supabase.from('recipe_ingredients').select('raw_text,normalized_name,quantity,unit,category').eq('recipe_id',id).order('id');if(error)throw error;state.draft=normaliseDraft({...r,meal_type:r.default_meal_type||'tea',ingredients:(ings||[]).map(i=>({raw_text:i.raw_text||'',name:i.normalized_name||'',quantity:i.quantity||0,unit:i.unit||'',category:i.category||'Other'})),editing_id:id,notes:''});state.tab='add';state.recipeDetail=null;render()}
async function calculateNutrition(showMessage=true){if(!state.draft)return;state.draft=readDraftFromForm();const d=state.draft;if(!d.ingredients.length)throw new Error('Add ingredients first.');const {data:{session}}=await supabase.auth.getSession();if(!session?.access_token)throw new Error('Please sign in again.');state.nutritionBusy=true;if(showMessage){state.message='Calculating nutrition from ingredient data…';state.messageType='ok';render()}try{const r=await fetch('/api/calculate-nutrition',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({ingredients:d.ingredients,servings:d.servings})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not calculate nutrition.');Object.assign(state.draft,{calories:j.per_serving.calories,protein_g:j.per_serving.protein_g,carbs_g:j.per_serving.carbs_g,fat_g:j.per_serving.fat_g,nutrition_source:'usda_fdc'});state.message=`Nutrition calculated from ${j.matched_count}/${j.total_count} ingredients using USDA FoodData Central.${j.unmatched?.length?' Check: '+j.unmatched.join(', '):''}`;state.messageType=j.unmatched?.length?'ok':'ok'}finally{state.nutritionBusy=false;render()}}
async function openRecipe(id){const r=state.recipes.find(x=>x.id===id);if(!r)return;const {data,error}=await supabase.from('recipe_ingredients').select('raw_text,normalized_name,quantity,unit,category').eq('recipe_id',id).order('id');if(error)throw error;state.recipeDetail={...r,ingredients:data||[]};render()}
async function deleteRecipe(id){if(!confirm('Delete this recipe from TeaPlan?'))return;for(const p of state.plans.filter(p=>p.recipe_id===id)){const {error}=await supabase.from('weekly_meals').delete().eq('id',p.id);if(error)throw error}const {error:ie}=await supabase.from('recipe_ingredients').delete().eq('recipe_id',id);if(ie)throw ie;const {error}=await supabase.from('recipes').delete().eq('id',id);if(error)throw error;state.recipeDetail=null;await loadCloudData();await rebuildRecipeShopping();await loadCloudData();state.message='Recipe deleted.';state.messageType='ok';render()}
function top(){return `<div class="top"><div><div class="brand">TeaPlan</div><div class="muted">${state.household?`🏠 ${esc(state.household.name)} · <span class="cloud"><span class="statusdot"></span>Live shared</span>`:'Shared household meal planner'}</div></div><button class="avatar" data-tab="account" type="button">👤</button></div>`}
function tabs(){if(!state.user||!state.household||state.tab==='account')return'';return `<nav class="tabs">${[['week','This week'],['recipes','Recipes'],['add','Add recipe'],['shop','Shopping']].map(([id,label])=>`<button type="button" class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</nav>`}
function macroLine(r){return `<div class="macros"><span class="macro">🔥 ${r.calories??'—'} kcal</span><span class="macro">💪 ${r.protein_g??'—'}g P</span><span class="macro">${r.carbs_g??'—'}g C</span><span class="macro">${r.fat_g??'—'}g F</span></div>`}
function quickPlannerHtml(){
 const types=['breakfast','lunch','tea','snack'];
 return `<div class="quickplanner"><div class="summaryline"><div><b>Plan whole week</b><div class="muted">Tap any box to add or change that meal.</div></div><button type="button" class="btn" id="closeQuickPlan">Close</button></div><div class="quickgrid"><div></div>${types.map(t=>`<div class="quickcell"><b>${mealIcon(t)} ${mealLabel(t)}</b></div>`).join('')}${[0,1,2,3,4,5,6].map(day=>`<div class="quickcell day">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][day]}<br><span class="muted">${shortDate(day).split(' ')[0]}</span></div>${types.map(type=>{const ps=slotPlans(day,type);const names=ps.map(p=>state.recipes.find(r=>r.id===p.recipe_id)?.title).filter(Boolean);return `<div class="quickcell"><button type="button" data-quick-slot="${day}" data-quick-type="${type}">${names.length?names.map(esc).join(' + '):'＋ Add'}</button></div>`}).join('')}`).join('')}</div></div>`;
}
function copyDayBoxHtml(day){
 if(state.copySourceDay!==day)return'';
 return `<div class="copybox"><b>Copy ${dayName(day)} to…</b><div class="muted">Copies all planned meals and their people assignments. Existing meals on the destination day are kept.</div><div class="copydays">${[0,1,2,3,4,5,6].filter(d=>d!==day).map(d=>`<button type="button" class="copyday" data-copy-day-to="${d}">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d]}</button>`).join('')}</div><button type="button" class="btn" style="margin-top:8px" id="cancelCopyDay">Cancel</button></div>`;
}
function planAddons(planId){return state.addons.filter(a=>a.weekly_meal_id===planId)}
function addonHtml(plan){const rows=planAddons(plan.id);return `<div class="addonbox"><b>🥦 Sides & extras</b>${rows.map(a=>`<div class="addonrow"><div class="grow">${esc(a.name)} <span class="muted">${fmt(a.quantity)} ${esc(a.unit||'')}</span></div><button type="button" class="smallbtn" data-remove-addon="${a.id}">×</button></div>`).join('')}<div class="addonform"><input id="addon-name-${plan.id}" placeholder="e.g. Broccoli"><input id="addon-qty-${plan.id}" type="number" step="0.1" value="1"><input id="addon-unit-${plan.id}" placeholder="unit"></div><button type="button" class="smallbtn" style="margin-top:6px" data-add-addon="${plan.id}">＋ Add side</button></div>`}
function freshnessHint(plan){const names=planAddons(plan.id).map(a=>a.name.toLowerCase()).join(' ');const r=state.recipes.find(x=>x.id===plan.recipe_id);const title=(r?.title||'').toLowerCase();const fresh=/chicken|fish|salmon|prawn|berries|strawberr|raspberr|spinach|salad|broccoli|mushroom|avocado|yoghurt|yogurt/.test(title+' '+names);if(!fresh)return'';const day=Number(plan.day_index||0);return day>=4?`<div class="freshhint">❄️ Fresh-food tip: this is late in the week. Consider freezing suitable meat/fish after shopping, or buying the fresh side later.</div>`:`<div class="freshhint">🌿 Fresh-food tip: good early-week slot for ingredients that don't keep as long.</div>`}
function weekView(){
 const types=['breakfast','lunch','tea','snack'];
 const selected=Math.max(0,Math.min(6,Number(state.selectedDay||0)));
 const pickerOpen=state.pickerDay!==null&&state.pickerType;
 const q=(state.weekSearch||'').trim(),filter=state.weekFilter||'all';
 const matches=state.recipes.filter(r=>recipeMatches(r,q,filter));
 const filters=[['all','All'],['chicken','Chicken'],['beef','Beef'],['pork','Pork'],['fish','Fish'],['pasta','Pasta'],['under500','Under 500 kcal'],['highprotein','High protein'],['quick','≤30 min'],['breakfast','Breakfast'],['snack','Snacks']];
 const dayTabs=`<div class="daytabs">${[0,1,2,3,4,5,6].map(day=>`<button type="button" class="daytab ${selected===day?'active':''}" data-select-day="${day}">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][day]}<br><span style="font-weight:650">${shortDate(day).split(' ')[0]}</span></button>`).join('')}</div>`;
 const profileNotice=!state.profiles.length?`<div class="profilesetup"><b>👥 Add your household people</b><div class="muted" style="margin-top:4px">Once you add people, tap their names under each meal and TeaPlan will calculate portions automatically.</div><button type="button" class="btn primary" style="margin-top:9px" data-tab="account">Set up people</button></div>`:'';
 const picker=pickerOpen?`<div class="picker"><div class="summaryline"><div><h3>Add ${mealLabel(state.pickerType)} for ${dayName(state.pickerDay)}</h3><div class="muted">You can add more than one meal in a slot — useful when someone is eating something different.</div></div><button type="button" class="btn" id="closePicker">Close</button></div><div class="searchrow" style="grid-template-columns:1fr"><input class="input" id="weekSearch" value="${esc(state.weekSearch)}" placeholder="Search recipes…"></div><div class="filterbar">${filters.map(([id,label])=>`<button type="button" class="filterbtn ${filter===id?'active':''}" data-week-filter="${id}">${label}</button>`).join('')}</div><div class="filtercount">${matches.length} recipe${matches.length===1?'':'s'}</div>${matches.length?matches.slice(0,30).map(r=>`<div class="pickitem"><div class="grow"><b>${esc(r.emoji||'🍽️')} ${esc(r.title)}</b><div class="pickmeta">${Number(r.prep_minutes||0)+Number(r.cook_minutes||0)} min · ${r.calories??'—'} kcal · ${r.protein_g??'—'}g protein</div></div><button type="button" class="btn primary" data-pick-recipe="${r.id}" data-pick-day="${state.pickerDay}" data-pick-type="${state.pickerType}">Add</button></div>`).join(''):'<div class="notice">No recipes match those filters.</div>'}</div>`:'';
 const day=selected;
 const slotHtml=type=>{const plans=slotPlans(day,type);return `<div class="slotheader"><div class="slotlabel">${mealIcon(type)} ${mealLabel(type)}</div><button class="smallbtn" type="button" data-open-picker="${day}" data-open-type="${type}">＋ ${plans.length?'Another':'Choose'}</button></div><div class="slotbody">${plans.length?plans.map(p=>{const r=state.recipes.find(x=>x.id===p.recipe_id);if(!r)return'';const ids=eaterIds(p),assigned=eaterCount(p);return `<div class="slotmealcard"><div class="slotmeal"><b>${esc(r.emoji||'🍽️')} ${esc(r.title)}</b><div class="muted">${r.calories??'—'} kcal · ${r.protein_g??'—'}g P · ${Number(r.prep_minutes||0)+Number(r.cook_minutes||0)} min</div></div>${state.profiles.length?`<div class="peoplebar">${state.profiles.map(pr=>`<button type="button" class="personchip ${ids.has(pr.id)?'active':''} ${pr.profile_type==='baby'?'baby':''}" data-toggle-eater="${p.id}" data-profile-id="${pr.id}">${esc(pr.emoji||'👤')} ${esc(pr.name)}</button>`).join('')}</div>${!assigned?'<span class="unassigned">Choose who is eating · currently counts as 1 portion</span>':''}`:`<span class="unassigned">${p.portions||1} portion${Number(p.portions||1)===1?'':'s'} · set up people to assign names</span>`}${(()=>{const eat=Math.max(1,assigned||Number(p.portions||1)),cook=Math.max(0,Number(p.cook_portions??r.servings??eat)),used=Math.max(0,Number(p.freezer_used||0)),extra=Math.max(0,cook+used-eat),avail=freezerAvailable(r.id);return `<div class="batchline"><span class="batchpill">Eating ${eat}</span><span class="batchpill">Cook ${cook}</span>${used?`<span class="batchpill">🧊 Using ${used}</span>`:''}${extra?`<span class="batchpill">Freeze ${extra}</span>`:''}</div><div class="batchline"><button type="button" class="batchbtn" data-cook-minus="${p.id}" data-cook-value="${Math.max(0,cook-1)}">− Cook</button><button type="button" class="batchbtn" data-cook-plus="${p.id}" data-cook-value="${Math.min(30,cook+1)}">＋ Cook</button>${extra>Number(p.freezer_saved||0)?`<button type="button" class="batchbtn" data-save-freezer="${p.id}">🧊 Add extras to freezer</button>`:''}${avail?`<button type="button" class="batchbtn" data-use-freezer="${p.id}">Use freezer (${avail})</button>`:''}</div>`})()}${addonHtml(p)}${freshnessHint(p)}<div class="mealactions"><button class="smallbtn" type="button" data-change-plan="${p.id}" data-open-picker="${day}" data-open-type="${type}">Change / add meal</button><button class="smallbtn" type="button" data-copy-meal="${p.id}">Copy meal</button><button class="smallbtn" type="button" data-remove-plan="${p.id}">Remove</button></div></div>`}).join(''):`<div class="emptymeal" style="padding:10px 0">Nothing planned</div>`}</div>`};
 const dayCard=`<div class="daycard selectedday"><div class="dayhead"><div><div class="daytitle">${dayName(day)}</div><div class="muted">${shortDate(day)}</div></div><button type="button" class="smallbtn" data-copy-day="${day}">Copy day</button></div>${copyDayBoxHtml(day)}${types.map(slotHtml).join('')}</div>`;
 const tools=`<div class="weektools"><button type="button" class="btn primary" id="openQuickPlan">📅 Plan whole week</button></div>`;
 return `<div class="card"><h2>Weekly menu</h2><p class="muted">Tap a day, choose meals, then tap the people who are eating each one.</p>${dayTabs}${tools}${state.quickPlan?quickPlannerHtml():''}<button type="button" class="overviewtoggle" id="toggleOverview"><span>Weekly overview</span><span>${state.overviewOpen?'⌃':'⌄'}</span></button>${state.overviewOpen?weeklyOverviewHtml():''}${profileNotice}${picker}${dayCard}</div>`;
}
function recipeView(){const detail=state.recipeDetail;const q=(state.recipeSearch||'').trim().toLowerCase();const list=state.recipes.filter(r=>!q||r.title.toLowerCase().includes(q));return `<div class="card"><div class="summaryline"><div><h2>Our recipes</h2><p class="muted">Search, view or edit anything saved to the household.</p></div><button class="btn primary" type="button" data-tab="add">＋ Add recipe</button></div><div class="searchrow" style="grid-template-columns:1fr auto auto"><input class="input" id="recipeSearch" value="${esc(state.recipeSearch)}" placeholder="Search recipes…"><button class="btn primary" type="button" id="doSearch">Search</button><button class="btn" type="button" id="clearSearch">Clear</button></div>${list.length?list.map(r=>`<div class="mealcard"><div class="mealhead"><div class="grow"><div class="mealname">${esc(r.emoji||'🍽️')} ${esc(r.title)}</div><div class="muted">${Number(r.prep_minutes||0)+Number(r.cook_minutes||0)} min · Serves ${r.servings||'—'} ${r.nutrition_source==='usda_fdc'?'<span class="badge">USDA macros</span>':''}</div>${macroLine(r)}</div><button class="btn" type="button" data-view-recipe="${r.id}">${detail?.id===r.id?'Hide':'View'}</button></div>${detail?.id===r.id?`<div class="detail"><h3>Ingredients</h3><ul>${detail.ingredients.map(i=>`<li>${esc(i.raw_text||`${qty(i.quantity,i.unit)} ${i.normalized_name}`)}</li>`).join('')}</ul><h3>Method</h3><ol>${(detail.method||[]).map(m=>`<li>${esc(m)}</li>`).join('')}</ol><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-edit-recipe="${r.id}">Edit recipe</button><button class="btn danger" type="button" data-delete-recipe="${r.id}">Delete recipe</button></div></div>`:''}</div>`).join(''):'<div class="notice">No recipes match that search.</div>'}</div>`}
function draftEditor(){const d=normaliseDraft(state.draft);const cats=['Meat','Fish','Fruit & Veg','Dairy','Bakery','Cupboard','Frozen','Drinks','Household','Other'];return `<div class="card"><h2>${d.editing_id?'Edit recipe':'Review recipe'}</h2><p class="muted">Meal type is only a default suggestion — you can use this recipe in any meal slot during weekly planning.</p><div class="editorgrid"><div><label class="label">Recipe name</label><input class="input" id="dTitle" value="${esc(d.title)}"></div><div><label class="label">Emoji</label><input class="input" id="dEmoji" value="${esc(d.emoji)}" maxlength="4"></div><div><label class="label">Suggested meal</label><select class="input" id="dMeal">${['breakfast','lunch','tea','snack'].map(x=>`<option value="${x}" ${d.meal_type===x?'selected':''}>${mealLabel(x)}</option>`).join('')}</select></div><div><label class="label">Servings</label><input class="input" id="dServings" type="number" min="1" max="30" value="${d.servings}"></div><div><label class="label">Prep minutes</label><input class="input" id="dPrep" type="number" min="0" value="${d.prep_minutes}"></div><div><label class="label">Cook minutes</label><input class="input" id="dCook" type="number" min="0" value="${d.cook_minutes}"></div></div><h3 style="margin-top:18px">Macros per serving</h3><div class="editorgrid"><input class="input" id="d_calories" type="number" min="0" value="${d.calories}" placeholder="kcal"><input class="input" id="d_protein_g" type="number" min="0" step="0.1" value="${d.protein_g}" placeholder="Protein g"><input class="input" id="d_carbs_g" type="number" min="0" step="0.1" value="${d.carbs_g}" placeholder="Carbs g"><input class="input" id="d_fat_g" type="number" min="0" step="0.1" value="${d.fat_g}" placeholder="Fat g"></div><div class="nutritionbox"><b>${d.nutrition_source==='usda_fdc'?'✅ Ingredient-based nutrition':'🧮 Calculate from ingredients'}</b><p class="muted">TeaPlan matches ingredients to USDA FoodData Central, totals the recipe and divides by servings. AI is only used to help normalise quantities — not to invent the nutrition values.</p><button class="btn primary" type="button" id="calcNutrition" ${state.nutritionBusy?'disabled':''}>${state.nutritionBusy?'Calculating…':'Calculate macros'}</button></div><h3 style="margin-top:18px">Ingredients</h3><div id="ingredientRows">${d.ingredients.map(i=>`<div class="ingredient-editor" data-ing-row><div><input class="input" data-i-name value="${esc(i.name)}" placeholder="Ingredient"><input class="input" style="margin-top:5px" data-i-raw value="${esc(i.raw_text)}" placeholder="Original wording"></div><input class="input" data-i-qty type="number" min="0" step="0.01" value="${i.quantity}"><input class="input" data-i-unit value="${esc(i.unit)}" placeholder="g/ml"><select class="input" data-i-cat style="grid-column:1/-1">${cats.map(c=>`<option ${i.category===c?'selected':''}>${c}</option>`).join('')}</select></div>`).join('')}</div><button type="button" class="btn" id="addIngredient">＋ Ingredient</button><h3 style="margin-top:18px">Method</h3><div id="methodRows">${d.method.map((m,n)=>`<div class="method-editor"><b>${n+1}.</b><textarea class="input" data-method-input rows="2">${esc(m)}</textarea></div>`).join('')}</div><button type="button" class="btn" id="addMethod">＋ Step</button><label class="label">Notes</label><textarea class="input textarea" id="dNotes">${esc(d.notes||'')}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button type="button" class="btn primary" id="saveRecipe">${d.editing_id?'Save changes':'Save to Our Recipes'}</button><button type="button" class="btn" id="cancelDraft">Cancel</button></div></div>`}
function addView(){if(state.draft)return draftEditor();return `<div class="card ${state.importBusy?'busy':''}"><h2>Add recipe</h2><p class="muted">Import with AI or enter it yourself. You always review before saving.</p><div class="sourcegrid">${[['text','📝','Paste text'],['url','🔗','Recipe link'],['image','📸','Photo / screenshot'],['manual','✏️','Manual']].map(([id,ic,label])=>`<button type="button" class="sourcebtn ${state.importMode===id?'active':''}" data-import-mode="${id}">${ic}<br>${label}</button>`).join('')}</div>${state.importMode==='text'?`<label class="label">Paste recipe text</label><textarea class="input textarea" id="importText" placeholder="Paste ingredients and method here…"></textarea><button class="btn primary" type="button" id="runImport" style="margin-top:10px">✨ Extract recipe</button>`:''}${state.importMode==='url'?`<label class="label">Recipe webpage</label><input class="input" id="importUrl" type="url" placeholder="https://…"><div class="notice">Normal recipe websites work best. If Instagram/TikTok blocks the recipe text, use a screenshot instead.</div><button class="btn primary" type="button" id="runImport">✨ Import link</button>`:''}${state.importMode==='image'?`<div class="filebox"><label><b>Choose a photo or screenshot</b><br><span class="muted">JPG, PNG or WEBP · max 5MB</span><br><input id="importImage" type="file" accept="image/jpeg,image/png,image/webp" style="margin-top:12px"></label>${state.importImage?`<div style="margin-top:12px"><img src="${state.importImage.data}" alt="Selected recipe" style="max-width:100%;max-height:260px;border-radius:12px;object-fit:contain"><div class="notice ok" style="margin-top:8px">✅ Image ready: ${esc(state.importImage.name)}</div></div>`:''}</div><button class="btn primary" type="button" id="runImport" style="margin-top:10px" ${(state.importImage&&state.importImage.data)?'':'disabled'}>✨ Read recipe</button>`:''}${state.importMode==='manual'?`<div class="notice">Start with a blank recipe and fill in the same editor AI uses.</div><button class="btn primary" type="button" id="manualStart">Create blank recipe</button>`:''}${state.importBusy?'<div class="notice">✨ TeaPlan AI is reading your recipe…</div>':''}</div>`}
function shopView(){const pantryHtml=`<div class="pantrycard"><h3>🏠 Cupboard & pantry</h3><p class="muted">TeaPlan subtracts these from recipe ingredients. “Always have” items never get added automatically.</p>${state.pantry.map(x=>`<div class="stockrow"><div class="grow"><b>${esc(x.name)}</b> ${x.always_have?'<span class="always">Always have</span>':''}<div class="muted">${x.always_have?'Staple':`${fmt(x.quantity)} ${esc(x.unit||'')}`}</div></div><button type="button" class="smallbtn" data-remove-pantry="${x.id}">×</button></div>`).join('')}<div class="addonform"><input id="pantryName" placeholder="e.g. Rice"><input id="pantryQty" type="number" step="0.1" value="1"><input id="pantryUnit" placeholder="g/ml"></div><label style="display:flex;gap:7px;align-items:center;margin-top:8px"><input id="pantryAlways" type="checkbox" style="width:auto"> Always have this staple</label><button type="button" class="smallbtn" style="margin-top:8px" id="addPantry">＋ Add to pantry</button></div>`;const freezerHtml=`<div class="freezercard"><h3>🧊 Freezer cupboard</h3><p class="muted">Frozen recipe portions can be used in a future week without adding those ingredients to the shop.</p>${state.freezer.length?state.freezer.map(x=>{const r=state.recipes.find(z=>z.id===x.recipe_id);return `<div class="freezerline"><div class="grow"><b>${esc(r?.emoji||'🍽️')} ${esc(r?.title||'Recipe')}</b><div class="muted">${Number(x.portions||0)} portion${Number(x.portions||0)===1?'':'s'} · frozen ${esc(x.frozen_at||'')}</div></div><button type="button" class="smallbtn" data-freezer-minus="${x.id}">−</button><button type="button" class="smallbtn" data-freezer-plus="${x.id}">＋</button></div>`}).join(''):'<div class="notice">Nothing in the freezer yet.</div>'}</div>`;const cats={};for(const x of state.shopping)(cats[x.category||'Other']??=[]).push(x);return `<div class="card"><h2>Shopping list</h2>${pantryHtml}${freezerHtml}<p class="muted">Meal quantities are already included. Tap the circle: <b>Need it → Already have → Bought</b>.</p><form class="add" id="manualForm"><input class="input" id="manualInput" placeholder="Add toilet roll, milk…" autocomplete="off"><button class="btn primary" type="submit">Add</button></form>${Object.keys(cats).length?Object.entries(cats).map(([cat,items])=>`<div class="category">${esc(cat)}</div>${items.map(x=>`<div class="row shopitem ${esc(x.status)}"><button type="button" class="statebtn" data-shop="${x.id}" data-status="${esc(x.status)}">${statusIcon(x.status)}</button><div class="grow"><b>${esc(x.display_name)}</b><div class="state-label">${statusLabel(x.status)}${x.source_type==='recipe'?' · From this week’s meals':' · Added manually'}</div></div><b>${x.quantity?qty(x.quantity,x.unit):''}</b>${x.source_type==='manual'?`<button type="button" class="btn danger" data-delete-shop="${x.id}">×</button>`:''}</div>`).join('')}`).join(''):`<div class="notice">Your shared shopping list is empty.</div>`}</div>`}
function accountView(){if(!state.user)return `<div class="card"><h2>Welcome to TeaPlan</h2><div class="authswitch"><button type="button" class="${state.authMode==='signin'?'active':''}" data-authmode="signin">Sign in</button><button type="button" class="${state.authMode==='signup'?'active':''}" data-authmode="signup">Create account</button></div><form id="authForm"><label class="label">Email</label><input class="input" id="email" type="email" required><label class="label">Password</label><input class="input" id="password" type="password" minlength="6" required><div style="margin-top:12px"><button class="btn primary" type="submit">${state.authMode==='signin'?'Sign in':'Create account'}</button></div></form></div>`;if(!state.household)return `<div class="card"><h2>Set up your household</h2><form id="createHousehold"><label class="label">Household name</label><input class="input" id="hname" value="Our Household" required><div style="margin-top:10px"><button class="btn primary">Create household</button></div></form><p class="muted" style="text-align:center;margin:16px 0">or</p><form id="joinHousehold"><label class="label">Invite code</label><input class="input" id="code" placeholder="A1B2C3D4" required><div style="margin-top:10px"><button class="btn">Join household</button></div></form><div style="margin-top:15px"><button class="btn danger" id="signOut" type="button">Sign out</button></div></div>`;return `<div class="card"><h2>${esc(state.household.name)}</h2><p class="muted">Signed in as ${esc(state.user.email)}</p><div class="invite"><span class="muted">HOUSEHOLD INVITE CODE</span><strong>${esc(state.household.invite_code)}</strong><span class="muted">Both phones share the same TeaPlan household.</span></div><h3>People</h3><p class="muted">Add everyone you want to assign to meals. Baby profiles are marked separately so we can build the baby planner around them next.</p>${state.profiles.length?state.profiles.map(p=>`<div class="profileline"><div class="grow"><b>${esc(p.emoji||'👤')} ${esc(p.name)}</b><div class="muted">${p.profile_type==='baby'?'Baby / child':'Adult'}</div></div><button class="smallbtn" type="button" data-delete-profile="${p.id}">Remove</button></div>`).join(''):'<div class="notice">No people added yet.</div>'}<form id="profileForm" class="profileform"><input class="input" id="profileName" placeholder="Name e.g. Andy" required><select class="input" id="profileType"><option value="adult">Adult</option><option value="baby">Baby / child</option></select><button class="btn primary" type="submit">Add</button></form><span class="cloud" style="margin-top:15px"><span class="statusdot"></span>Realtime enabled</span><div style="margin-top:15px"><button class="btn danger" id="signOut" type="button">Sign out</button> <button class="btn" type="button" data-tab="week">← Back</button></div></div>`}
function content(){if(!state.user||!state.household)state.tab='account';if(state.tab==='week')return weekView();if(state.tab==='recipes')return recipeView();if(state.tab==='add')return addView();if(state.tab==='shop')return shopView();return accountView()}
function render(){root.innerHTML=`<main class="app">${top()}${state.message?`<div class="notice ${state.messageType==='error'?'error':'ok'}">${esc(state.message)}</div>`:''}${state.loading?'<div class="loading">Loading shared household…</div>':content()}${tabs()}</main>`;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;state.message='';state.recipeDetail=null;render()}));document.querySelectorAll('[data-authmode]').forEach(b=>b.addEventListener('click',()=>{state.authMode=b.dataset.authmode;state.message='';render()}));document.querySelectorAll('[data-mealtype]').forEach(b=>b.addEventListener('click',()=>{state.mealType=b.dataset.mealtype;render()}));const rs=document.getElementById('recipeSearch');if(rs){rs.addEventListener('input',()=>{state.recipeSearch=rs.value});rs.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();state.recipeSearch=rs.value;render()}})}const ds=document.getElementById('doSearch');if(ds)ds.addEventListener('click',()=>{state.recipeSearch=document.getElementById('recipeSearch')?.value||'';render()});const cs=document.getElementById('clearSearch');if(cs)cs.addEventListener('click',()=>{state.recipeSearch='';render()});document.querySelectorAll('[data-count-recipe]').forEach(b=>b.addEventListener('click',()=>setPortions(b.dataset.countRecipe,b.dataset.countType,Number(b.dataset.count),Number(b.dataset.countDay||0))));document.querySelectorAll('[data-select-day]').forEach(b=>b.addEventListener('click',()=>{state.selectedDay=Number(b.dataset.selectDay);state.pickerDay=null;state.pickerType=null;render()}));document.querySelectorAll('[data-summary-profile]').forEach(b=>b.addEventListener('click',()=>{state.summaryProfileId=b.dataset.summaryProfile;render()}));const oq=document.getElementById('openQuickPlan');if(oq)oq.addEventListener('click',()=>{state.quickPlan=true;render()});const cq=document.getElementById('closeQuickPlan');if(cq)cq.addEventListener('click',()=>{state.quickPlan=false;render()});document.querySelectorAll('[data-quick-slot]').forEach(b=>b.addEventListener('click',()=>{state.selectedDay=Number(b.dataset.quickSlot);state.pickerDay=Number(b.dataset.quickSlot);state.pickerType=b.dataset.quickType;state.weekSearch='';state.weekFilter='all';render()}));document.querySelectorAll('[data-copy-day]').forEach(b=>b.addEventListener('click',()=>{state.copySourceDay=Number(b.dataset.copyDay);render()}));document.querySelectorAll('[data-copy-day-to]').forEach(b=>b.addEventListener('click',async()=>{try{await copyWholeDay(state.copySourceDay,Number(b.dataset.copyDayTo))}catch(e){setMessage(e.message,'error')}}));const cc=document.getElementById('cancelCopyDay');if(cc)cc.addEventListener('click',()=>{state.copySourceDay=null;render()});document.querySelectorAll('[data-copy-meal]').forEach(b=>b.addEventListener('click',async()=>{try{await copyMealPrompt(b.dataset.copyMeal)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-cook-minus],[data-cook-plus]').forEach(b=>b.addEventListener('click',async()=>{try{await setCookPortions(b.dataset.cookMinus||b.dataset.cookPlus,Number(b.dataset.cookValue))}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-save-freezer]').forEach(b=>b.addEventListener('click',async()=>{try{await saveFreezerExtras(b.dataset.saveFreezer)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-use-freezer]').forEach(b=>b.addEventListener('click',async()=>{try{await useFreezerForPlan(b.dataset.useFreezer)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-freezer-minus]').forEach(b=>b.addEventListener('click',async()=>{try{await adjustFreezerItem(b.dataset.freezerMinus,-1)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-freezer-plus]').forEach(b=>b.addEventListener('click',async()=>{try{await adjustFreezerItem(b.dataset.freezerPlus,1)}catch(e){setMessage(e.message,'error')}}));const to=document.getElementById('toggleOverview');if(to)to.addEventListener('click',()=>{state.overviewOpen=!state.overviewOpen;localStorage.setItem('teaplan_overview_open',state.overviewOpen?'1':'0');render()});document.querySelectorAll('[data-add-addon]').forEach(b=>b.addEventListener('click',async()=>{try{await addAddon(b.dataset.addAddon)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-remove-addon]').forEach(b=>b.addEventListener('click',async()=>{try{await removeAddon(b.dataset.removeAddon)}catch(e){setMessage(e.message,'error')}}));const ap=document.getElementById('addPantry');if(ap)ap.addEventListener('click',async()=>{try{await addPantryItem(document.getElementById('pantryName').value,document.getElementById('pantryQty').value,document.getElementById('pantryUnit').value,document.getElementById('pantryAlways').checked);await rebuildRecipeShopping();await loadCloudData();render()}catch(e){setMessage(e.message,'error')}});document.querySelectorAll('[data-remove-pantry]').forEach(b=>b.addEventListener('click',async()=>{try{await removePantryItem(b.dataset.removePantry);await rebuildRecipeShopping();await loadCloudData();render()}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-toggle-eater]').forEach(b=>b.addEventListener('click',async()=>{try{await toggleEater(b.dataset.toggleEater,b.dataset.profileId)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-remove-plan]').forEach(b=>b.addEventListener('click',async()=>{try{await removePlannedMeal(b.dataset.removePlan)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-delete-profile]').forEach(b=>b.addEventListener('click',async()=>{try{await deleteProfile(b.dataset.deleteProfile)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-open-picker]').forEach(b=>b.addEventListener('click',()=>{state.pickerDay=Number(b.dataset.openPicker);state.pickerType=b.dataset.openType;state.weekSearch='';state.weekFilter='all';render()}));document.querySelectorAll('[data-pick-recipe]').forEach(b=>b.addEventListener('click',async()=>{try{await chooseRecipeForSlot(b.dataset.pickRecipe,Number(b.dataset.pickDay),b.dataset.pickType)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-clear-slot]').forEach(b=>b.addEventListener('click',async()=>{try{await clearSlot(Number(b.dataset.clearSlot),b.dataset.clearType)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-slot-count]').forEach(b=>b.addEventListener('click',()=>setPortions(b.dataset.slotCount,b.dataset.slotType,Number(b.dataset.slotValue),Number(b.dataset.slotDay))));document.querySelectorAll('[data-week-filter]').forEach(b=>b.addEventListener('click',()=>{state.weekFilter=b.dataset.weekFilter;render()}));const ws=document.getElementById('weekSearch');if(ws){ws.addEventListener('input',()=>{state.weekSearch=ws.value});ws.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();state.weekSearch=ws.value;render()}})}const cp=document.getElementById('closePicker');if(cp)cp.addEventListener('click',()=>{state.pickerDay=null;state.pickerType=null;render()});document.querySelectorAll('[data-shop]').forEach(b=>b.addEventListener('click',async()=>{try{await cycleShopping(b.dataset.shop,b.dataset.status)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-delete-shop]').forEach(b=>b.addEventListener('click',async()=>{try{await deleteShopping(b.dataset.deleteShop)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-import-mode]').forEach(b=>b.addEventListener('click',()=>{state.importMode=b.dataset.importMode;state.message='';render()}));document.querySelectorAll('[data-view-recipe]').forEach(b=>b.addEventListener('click',async()=>{try{if(state.recipeDetail?.id===b.dataset.viewRecipe){state.recipeDetail=null;render()}else await openRecipe(b.dataset.viewRecipe)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-edit-recipe]').forEach(b=>b.addEventListener('click',async()=>{try{await editRecipe(b.dataset.editRecipe)}catch(e){setMessage(e.message,'error')}}));document.querySelectorAll('[data-delete-recipe]').forEach(b=>b.addEventListener('click',async()=>{try{await deleteRecipe(b.dataset.deleteRecipe)}catch(e){setMessage(e.message,'error')}}));const fi=document.getElementById('importImage');if(fi)fi.addEventListener('change',()=>{const file=fi.files?.[0];if(!file){state.importImage=null;render();return}if(file.size>5_000_000){fi.value='';state.importImage=null;return setMessage('Please choose an image under 5MB.','error')}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){fi.value='';state.importImage=null;return setMessage('Please choose a JPG, PNG or WEBP image.','error')}const r=new FileReader();r.onload=()=>{state.importImage={data:String(r.result),name:file.name,size:file.size,type:file.type};state.message='Image attached — ready for TeaPlan AI.';state.messageType='ok';render();requestAnimationFrame(()=>{const b=document.getElementById('runImport');if(b&&state.importImage?.data)b.disabled=false})};r.onerror=()=>setMessage('Could not read that image.','error');r.readAsDataURL(file)});const ri=document.getElementById('runImport');if(ri)ri.addEventListener('click',async()=>{try{await importRecipeAI()}catch(e){state.importBusy=false;setMessage(e.message,'error')}});const ms=document.getElementById('manualStart');if(ms)ms.addEventListener('click',()=>{state.draft=blankDraft();render()});const ai=document.getElementById('addIngredient');if(ai)ai.addEventListener('click',()=>{state.draft=readDraftFromForm();state.draft.ingredients.push({raw_text:'',name:'',quantity:0,unit:'',category:'Other'});render()});const am=document.getElementById('addMethod');if(am)am.addEventListener('click',()=>{state.draft=readDraftFromForm();state.draft.method.push('');render()});const cn=document.getElementById('calcNutrition');if(cn)cn.addEventListener('click',async()=>{try{await calculateNutrition(true)}catch(e){state.nutritionBusy=false;setMessage(e.message,'error')}});const sr=document.getElementById('saveRecipe');if(sr)sr.addEventListener('click',async()=>{try{await saveDraftRecipe()}catch(e){setMessage(e.message,'error')}});const cd=document.getElementById('cancelDraft');if(cd)cd.addEventListener('click',()=>{state.draft=null;state.message='';render()});const mf=document.getElementById('manualForm');if(mf)mf.addEventListener('submit',async e=>{e.preventDefault();const i=document.getElementById('manualInput');try{await addManualItem(i.value);i.value=''}catch(err){setMessage(err.message,'error')}});const pf=document.getElementById('profileForm');if(pf)pf.addEventListener('submit',async e=>{e.preventDefault();try{await addProfile(document.getElementById('profileName').value,document.getElementById('profileType').value)}catch(err){setMessage(err.message,'error')}});const af=document.getElementById('authForm');if(af)af.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;let res=state.authMode==='signup'?await supabase.auth.signUp({email,password}):await supabase.auth.signInWithPassword({email,password});if(res.error)return setMessage(res.error.message,'error');state.message=state.authMode==='signup'?'Account created. Check your email if confirmation is enabled.':'Signed in.';await init()});const ch=document.getElementById('createHousehold');if(ch)ch.addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('hname').value.trim();const {data,error}=await supabase.rpc('create_household',{household_name:name});if(error)return setMessage(error.message,'error');state.household=data;await ensureStarterRecipes();await loadCloudData();await setupRealtime();state.tab='week';render()});const jh=document.getElementById('joinHousehold');if(jh)jh.addEventListener('submit',async e=>{e.preventDefault();const code=document.getElementById('code').value.trim();const {data,error}=await supabase.rpc('join_household',{code});if(error)return setMessage(error.message,'error');state.household=data;await loadCloudData();await setupRealtime();state.tab='week';render()});const so=document.getElementById('signOut');if(so)so.addEventListener('click',async()=>{await supabase.auth.signOut();if(state.channel)await supabase.removeChannel(state.channel);Object.assign(state,{user:null,household:null,recipes:[],plans:[],shopping:[],profiles:[],tab:'account',message:'',channel:null,draft:null,recipeDetail:null});render()})}
let initRunning=false;
async function init(){if(initRunning)return;initRunning=true;state.loading=true;render();const timer=setTimeout(()=>{if(state.loading){state.message='TeaPlan is taking too long to load. Please refresh and try again.';state.messageType='error';state.loading=false;render()}},12000);try{await loadUser();await loadHousehold();if(state.user&&state.household){await loadCloudData();await setupRealtime();state.tab=state.tab==='account'?'week':state.tab}}catch(e){state.message=e.message||'Could not load TeaPlan';state.messageType='error'}finally{clearTimeout(timer);state.loading=false;initRunning=false;render()}}
supabase.auth.onAuthStateChange((event,session)=>{state.user=session?.user||null;if(event==='SIGNED_OUT'){state.household=null;state.recipes=[];state.plans=[];state.shopping=[];state.tab='account';render();return}if(event==='SIGNED_IN'&&!state.loading&&!state.household){setTimeout(()=>init(),0)}});
init();
